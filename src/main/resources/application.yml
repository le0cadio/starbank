spring:
  application:
    name: stark-bank-challenge
  profiles:
    active: local
  config:
    import: "optional:file:./secrets.yml"
  datasource:
    url: jdbc:h2:mem:starkbank;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true
  flyway:
    baselineOnMigrate: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.starkbank: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

starkbank:
  credentials:
    environment: sandbox
    project-id: ""
    private-key: ""
  destination:
    bank-code: "20018183"
    branch: "0001"
    account: "6341320293482496"
    name: "Stark Bank S.A."
    tax-id: "20.018.183/0001-80"
    account-type: payment
